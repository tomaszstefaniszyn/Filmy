<header><h1>Filmy do obejrzenia</h1><p>Lista Tomasza. Oznacz film jako do obejrzenia, do rozważenia albo go odrzuć. Wybory zapisują się w tej przeglądarce.</p><div class="stats" id="stats"></div></header>
<main><h2 class="sechead" id="sec"></h2><div id="finder" class="finder" hidden><label for="q">Dodaj film do listy</label><input id="q" type="search" placeholder="Tytuł po polsku lub angielsku albo reżyser" autocomplete="off" enterkeyhint="search"><div id="hits" aria-live="polite"></div></div><p class="empty" id="empty" hidden>Brak filmów w tej sekcji</p><div id="list"></div></main><p id="synced" aria-live="polite"></p>
<script>
let films=[],base=[],custom=[];const K="koko-filmy",CK="koko-filmy-custom",OK="koko-filmy-oceny";let m=JSON.parse(localStorage.getItem(K)||"{}");
let oceny={};try{oceny=JSON.parse(localStorage.getItem(OK)||"{}");}catch(e){oceny={};}
if(!oceny||typeof oceny!=="object")oceny={};
try{custom=JSON.parse(localStorage.getItem(CK)||"[]");}catch(e){custom=[];}
if(!Array.isArray(custom))custom=[];
const catalog=()=>{films=[...base,...custom];};
const reel='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.3" fill="currentColor"/><g fill="currentColor"><circle cx="12" cy="6.1" r="1.35"/><circle cx="17.1" cy="9.05" r="1.35"/><circle cx="17.1" cy="14.95" r="1.35"/><circle cx="12" cy="17.9" r="1.35"/><circle cx="6.9" cy="14.95" r="1.35"/><circle cx="6.9" cy="9.05" r="1.35"/></g></svg>';
const clap='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9.2" width="18" height="11" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="currentColor" d="M3.3 9.2 6.7 3.8h2.5L5.6 9.2H3.3zm4.7 0 3.4-5.4h2.5L10.5 9.2H8zm4.7 0 3.4-5.4h2.6L15.2 9.2h-2.5z"/></svg>';
const ticket='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M2.6 7.2h18.8v2.6a2.15 2.15 0 0 0 0 4.2v2.8H2.6v-2.8a2.15 2.15 0 0 0 0-4.2V7.2zm11.3.9h1.5v7.8h-1.5V8.1z"/></svg>';
const cut='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.2" y="2.6" width="11.6" height="18.8" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.7"/><g fill="currentColor"><rect x="8.1" y="4.1" width="1.5" height="1.7" rx=".3"/><rect x="11.25" y="4.1" width="1.5" height="1.7" rx=".3"/><rect x="14.4" y="4.1" width="1.5" height="1.7" rx=".3"/><rect x="8.1" y="18.2" width="1.5" height="1.7" rx=".3"/><rect x="11.25" y="18.2" width="1.5" height="1.7" rx=".3"/><rect x="14.4" y="18.2" width="1.5" height="1.7" rx=".3"/></g><path d="M9 9.6 15 15.6M15 9.6 9 15.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const SECS={'na-liscie':{st:'',name:'Na liście'},'do-obejrzenia':{st:'w',name:'Do obejrzenia'},'do-rozwazenia':{st:'r',name:'Do rozważenia'},'odrzucone':{st:'x',name:'Odrzucone'},'obejrzane':{st:'d',name:'Obejrzane'}};
const secId=()=>SECS[location.hash.slice(1)]?location.hash.slice(1):'na-liscie';
const pick=id=>{location.hash=id};
const set=(i,v)=>{const t=films[i].t;m[t]=m[t]===v?"":v;localStorage.setItem(K,JSON.stringify(m));ask=null;askFocus=false;markChanged();draw()};
const fid=f=>{if(!f)return "";if(f.qid)return f.qid;const im=(String(f.imdbUrl||"").match(/tt\d+/)||String(f.imdb||"").match(/^tt\d+$/)||[])[0];if(im)return im;const fw=String(f.url||"").match(/-(\d+)$/);if(fw)return "fw:"+fw[1];return "t:"+(f.t||"")+"|"+(f.y||"");};
function rate(i,n){const id=fid(films[i]);if(!id)return;if(oceny[id]===n)delete oceny[id];else oceny[id]=n;localStorage.setItem(OK,JSON.stringify(oceny));markChanged();draw();}
let ask=null,askFocus=false;
function starBtns(i,mark,mode){return Array.from({length:10},(_,k)=>{const n=k+1;const act=mode==="ask"?`confirmWatch(${i},${n})`:`rate(${i},${n})`;return `<button type="button" class="star${Number.isInteger(mark)&&mark>=n?" on":""}" aria-label="Ocena ${n}" aria-pressed="${mark===n}" onclick="${act}"><span aria-hidden="true">★</span><span class="n">${n}</span></button>`;}).join("");}
function askWatch(i){ask=ask===i?null:i;askFocus=ask!==null;draw();}
function cancelAsk(){ask=null;askFocus=false;draw();}
function confirmWatch(i,n){const f=films[i];if(!f||n<1||n>10)return;const id=fid(f);if(!id)return;oceny[id]=n;localStorage.setItem(OK,JSON.stringify(oceny));m[f.t]="d";localStorage.setItem(K,JSON.stringify(m));ask=null;askFocus=false;markChanged();draw();}
addEventListener("keydown",e=>{if(e.key==="Escape"&&ask!==null)cancelAsk();});
function validRec(rec){return !!rec&&typeof rec==="object"&&Array.isArray(rec.based_on)&&rec.based_on.length>0&&rec.based_on.every(x=>typeof x==="string"&&x.trim())&&typeof rec.why==="string"&&!!rec.why.trim();}
const NTFY="https://ntfy.sh/koko-filmy-527998526e3aab3a6ce279ed",TSK="koko-filmy-ts";
let syncTimer=null;
function markChanged(){localStorage.setItem(TSK,new Date().toISOString());clearTimeout(syncTimer);syncTimer=setTimeout(()=>postSnapshot(),3000);}
function showSynced(){const el=document.getElementById("synced");if(!el)return;el.textContent="Zsynchronizowano";el.classList.add("on");clearTimeout(showSynced._t);showSynced._t=setTimeout(()=>el.classList.remove("on"),2200);}
function buildSnap(){const ratings={};for(const id in oceny){const n=oceny[id];if(Number.isInteger(n)&&n>=1&&n<=10)ratings[id]=n;}const status={};for(const f of films){const s=m[f.t];if(s==="w"||s==="r"||s==="d"||s==="x")status[fid(f)]=s;}const list=custom.map(f=>({id:fid(f),t:f.t||"",o:f.o||"",y:f.y||"",dir:f.director||"",wd:f.qid||"",img:f.img||"",yt:f.yt||""}));return {v:1,ts:localStorage.getItem(TSK)||new Date().toISOString(),ratings,status,custom:list};}
function splitSnap(snap){const whole=JSON.stringify(snap);if(whole.length<=4000)return [whole];const items=[];for(const k in snap.ratings)items.push(["r",k,snap.ratings[k]]);for(const k in snap.status)items.push(["s",k,snap.status[k]]);for(const c of snap.custom)items.push(["c",c]);const parts=[];let cur={v:1,ts:snap.ts,ratings:{},status:{},custom:[]};const measure=o=>JSON.stringify({...o,part:1,of:99}).length;const add=(bucket,it)=>{const next=JSON.parse(JSON.stringify(bucket));if(it[0]==="r")next.ratings[it[1]]=it[2];else if(it[0]==="s")next.status[it[1]]=it[2];else next.custom.push(it[1]);return next;};for(const it of items){let piece=it;if(it[0]==="c"&&measure(add({v:1,ts:snap.ts,ratings:{},status:{},custom:[]},it))>4000)piece=["c",{...it[1],img:String(it[1].img||"").slice(0,180)}];const next=add(cur,piece);const used=Object.keys(cur.ratings).length||Object.keys(cur.status).length||cur.custom.length;if(measure(next)>4000&&used){parts.push(cur);cur=add({v:1,ts:snap.ts,ratings:{},status:{},custom:[]},piece);}else cur=next;}if(Object.keys(cur.ratings).length||Object.keys(cur.status).length||cur.custom.length)parts.push(cur);if(parts.length<2)return [JSON.stringify(parts[0]||snap)];return parts.map((p,i)=>JSON.stringify({...p,part:i+1,of:parts.length}));}
async function postSnapshot(){try{const bodies=splitSnap(buildSnap());for(const body of bodies){const r=await fetch(NTFY,{method:"POST",body});if(!r.ok)return;}showSynced();}catch(e){}}
function localEmpty(){const st=Object.values(m).some(v=>v==="w"||v==="r"||v==="d"||v==="x");return !st&&Object.keys(oceny).length===0&&custom.length===0;}
function mergeStan(stan){if(!stan||stan.v!==1)return;const remote=stan.ts||"";const localT=localStorage.getItem(TSK)||"";if(!localEmpty()&&!(remote&&(!localT||remote>localT)))return;if(localEmpty()&&!remote&&!Object.keys(stan.ratings||{}).length&&!Object.keys(stan.status||{}).length&&!(stan.custom||[]).length)return;oceny=stan.ratings&&typeof stan.ratings==="object"?stan.ratings:{};custom=(stan.custom||[]).map(c=>({t:c.t||"",o:c.o||c.t||"",y:c.y||"",director:c.dir||"",qid:c.wd||"",img:c.img||"",yt:c.yt||"",g:"",l:"",w:"",a:"",fw:"",imdb:"",rt:"",url:"",custom:true}));catalog();const st=stan.status||{};m={};for(const f of films){const s=st[fid(f)];if(s==="w"||s==="r"||s==="d"||s==="x")m[f.t]=s;}localStorage.setItem(K,JSON.stringify(m));localStorage.setItem(OK,JSON.stringify(oceny));saveCustom({silent:true});if(remote)localStorage.setItem(TSK,remote);}
addEventListener('hashchange',()=>{ask=null;askFocus=false;draw();});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>(s||"").trim().toLowerCase();
const FILM=new Set(["Q11424","Q24869","Q202866","Q226730","Q506240","Q29168811","Q20650540","Q336144","Q21010853"]);
const SKIP=new Set(["Q5","Q21191270","Q5398426","Q15416"]);
const claimIds=(ent,p)=>((ent&&ent.claims&&ent.claims[p])||[]).map(c=>c.mainsnak&&c.mainsnak.datavalue&&c.mainsnak.datavalue.value&&c.mainsnak.datavalue.value.id).filter(Boolean);
const claimStr=(ent,p)=>{const c=((ent&&ent.claims&&ent.claims[p])||[])[0];return c&&c.mainsnak&&c.mainsnak.datavalue?c.mainsnak.datavalue.value:"";};
const lab=(ent,lang)=>ent&&ent.labels&&ent.labels[lang]&&ent.labels[lang].value||"";
const isHuman=ent=>claimIds(ent,"P31").includes("Q5");
const isFilm=ent=>claimIds(ent,"P31").some(id=>FILM.has(id));
const isDirectedWork=ent=>{const p=claimIds(ent,"P31");return p.length&&!isHuman(ent)&&!p.some(id=>SKIP.has(id));};
function yearOf(ent){const years=((ent.claims||{}).P577||[]).filter(c=>c.rank!=="deprecated"&&c.mainsnak&&c.mainsnak.datavalue).map(c=>String(c.mainsnak.datavalue.value.time||"").slice(1,5)).filter(y=>/^\d{4}$/.test(y)).map(Number);return years.length?String(Math.min(...years)):"";}
async function wd(params){const u=new URL("https://www.wikidata.org/w/api.php");u.searchParams.set("format","json");u.searchParams.set("origin","*");for(const k in params)u.searchParams.set(k,params[k]);const r=await fetch(u);if(!r.ok)throw new Error("wd");return r.json();}
async function getEntities(ids){const out={};for(let i=0;i<ids.length;i+=40){const part=ids.slice(i,i+40);if(!part.length)continue;const d=await wd({action:"wbgetentities",ids:part.join("|"),props:"labels|claims|sitelinks",languages:"pl|en",sitefilter:"plwiki|enwiki"});Object.assign(out,d.entities||{});}return out;}
function toFilm(ent,dirs,hint){const t=lab(ent,"pl")||(hint&&hint.pl)||lab(ent,"en")||(hint&&hint.en);if(!t)return null;const en=lab(ent,"en")||(hint&&hint.en)||"";const o=en&&en!==t?en:t;const y=yearOf(ent);const director=claimIds(ent,"P57").map(id=>{const d=dirs[id];return d?(lab(d,"pl")||lab(d,"en")):"";}).filter(Boolean).slice(0,3).join(", ");const imdb=claimStr(ent,"P345");const fw=claimStr(ent,"P5032");const sl=ent.sitelinks||{};const p3383=claimStr(ent,"P3383"),p18=claimStr(ent,"P18"),p1651=claimStr(ent,"P1651");const url=fw?"https://www.filmweb.pl/film/"+encodeURIComponent(t).replace(/%20/g,"+")+"-"+y+"-"+fw:"https://www.filmweb.pl/search#/?query="+encodeURIComponent(t);return {t,o,g:"",y,l:"",w:"",a:"",fw:"",imdb:"",rt:"",url,imdbUrl:imdb?"https://www.imdb.com/title/"+imdb+"/":"",yt:"",img:"",director,qid:ent.id,custom:true,wikiPl:(sl.plwiki&&sl.plwiki.title)||"",wikiEn:(sl.enwiki&&sl.enwiki.title)||"",p3383,p18,p1651};}
const commonsUrl=name=>"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(name)+"?width=500";
const fileUrl=(site,title)=>"https://"+site+"/wiki/Special:FilePath/"+encodeURIComponent(String(title).replace(/^(File|Plik|Image|Grafika):/i,""))+"?width=500";
const badImg=s=>/logo|icon|symbol|\.svg(\?|$)|cast|premiere|commons-logo|wikiquote/i.test(s||"");
function imgOk(url){return new Promise(res=>{if(!url){res(false);return;}const im=new Image();const t=setTimeout(()=>res(false),8000);im.onload=()=>{clearTimeout(t);res((im.naturalWidth||0)>60);};im.onerror=()=>{clearTimeout(t);res(false);};im.referrerPolicy="no-referrer";im.src=url;});}
async function firstOk(urls){const seen=new Set();for(const u of urls){if(!u||badImg(u)||seen.has(u))continue;seen.add(u);if(await imgOk(u))return u;}return "";}
async function wikiCandidates(site,title){if(!site||!title)return [];const u=new URL("https://"+site+"/w/api.php");u.searchParams.set("action","query");u.searchParams.set("prop","pageimages|images");u.searchParams.set("titles",title);u.searchParams.set("piprop","thumbnail|original");u.searchParams.set("pithumbsize","500");u.searchParams.set("imlimit","40");u.searchParams.set("format","json");u.searchParams.set("origin","*");const r=await fetch(u);if(!r.ok)return [];const data=await r.json();const page=Object.values((data.query&&data.query.pages)||{})[0]||{};const out=[];const thumb=(page.thumbnail&&page.thumbnail.source)||(page.original&&page.original.source)||"";if(thumb)out.push(thumb);const files=(page.images||[]).map(im=>im.title||"");const poster=files.filter(t=>/poster|plakat|theatrical/i.test(t));const main=files.filter(t=>/\(\d{4}/.test(t)&&/\.(jpe?g|png|webp)$/i.test(t));for(const t of [...poster,...main])out.push(fileUrl(site,t));return out;}
async function ensureWiki(film){if(!film.qid||film._wikiOk)return;if((film.wikiPl||film.wikiEn)&&(film.p1651||film.p18||film.p3383)){film._wikiOk=true;return;}const d=await wd({action:"wbgetentities",ids:film.qid,props:"claims|sitelinks",sitefilter:"plwiki|enwiki"});const e=d.entities&&d.entities[film.qid];if(!e)return;const sl=e.sitelinks||{};film.wikiPl=film.wikiPl||(sl.plwiki&&sl.plwiki.title)||"";film.wikiEn=film.wikiEn||(sl.enwiki&&sl.enwiki.title)||"";film.p3383=film.p3383||claimStr(e,"P3383");film.p18=film.p18||claimStr(e,"P18");film.p1651=film.p1651||claimStr(e,"P1651");film._wikiOk=true;}
async function findPoster(film){try{await ensureWiki(film);const direct=await firstOk([film.p3383,film.p18].filter(Boolean).map(commonsUrl));if(direct)return direct;for(const [site,title] of [["pl.wikipedia.org",film.wikiPl],["en.wikipedia.org",film.wikiEn]]){const ok=await firstOk(await wikiCandidates(site,title));if(ok)return ok;}}catch(e){}return "";}
const TRAILERS=["https://api.piped.private.coffee/search?filter=videos&q="];
async function ytTitle(id){try{const r=await fetch("https://www.youtube.com/oembed?format=json&url="+encodeURIComponent("https://www.youtube.com/watch?v="+id));if(!r.ok)throw new Error("oe");const d=await r.json();return d.title||"";}catch(e){try{const r=await fetch("https://noembed.com/embed?url="+encodeURIComponent("https://www.youtube.com/watch?v="+id));if(!r.ok)return "";const d=await r.json();return d.error?"":(d.title||"");}catch(e2){return "";}}}
function parseVid(it){if(it.videoId&&/^[\w-]{11}$/.test(it.videoId))return it.videoId;const m=String(it.url||"").match(/v=([\w-]{11})/);return m?m[1]:"";}
async function searchTrailer(q){for(const base of TRAILERS){try{const r=await fetch(base+encodeURIComponent(q));if(!r.ok)continue;const data=await r.json();let items=data.items||(Array.isArray(data)?data:[]);items=items.filter(it=>it&&(it.type==="stream"||it.type==="video"||it.videoId||it.url));items.sort((a,b)=>{const sc=it=>{const t=(it.title||"").toLowerCase();let s=0;if(t.includes("official trailer"))s+=5;if(t.includes("trailer")||t.includes("zwiastun"))s+=3;if(t.includes("teaser"))s+=1;if(t.includes("youtube movies"))s-=4;return s;};return sc(b)-sc(a);});for(const it of items.slice(0,4)){const id=parseVid(it);if(!id)continue;const title=(await ytTitle(id)).toLowerCase();if(title&&/trailer|zwiastun/.test(title)&&!title.includes("youtube movies"))return id;}}catch(e){}}return "";}
async function findTrailer(film){try{await ensureWiki(film);const raw=film.p1651||"";if(/^[\w-]{11}$/.test(raw)){const title=(await ytTitle(raw)).toLowerCase();if(title&&/trailer|zwiastun/.test(title))return raw;}const name=film.o||film.t;return await searchTrailer(`${name} ${film.y||""} official trailer`.replace(/\s+/g," ").trim())||await searchTrailer(`${name} official trailer`)||"";}catch(e){return "";}}
function saveCustom(opts){localStorage.setItem(CK,JSON.stringify(custom.map(c=>{const {_mediaBusy,_wikiOk,...rest}=c;return rest;})));if(!opts||!opts.silent)markChanged();}
function ensureMedia(){for(const f of custom){if(!f||f._mediaBusy||(f.img&&f.yt))continue;f._mediaBusy=true;(async()=>{if(!f.img)f.img=await findPoster(f)||"";if(!f.yt)f.yt=await findTrailer(f)||"";saveCustom();catalog();if(f.img||f.yt)draw();})().catch(()=>{});}}
const listed=h=>films.some(f=>(h.qid&&f.qid===h.qid)||norm(f.t)===norm(h.t)||(h.imdbUrl&&f.imdbUrl&&f.imdbUrl===h.imdbUrl));
let lastHits=[],seq=0,timer;
function renderHits(){hits.innerHTML=lastHits.map((h,i)=>{const thumb=h.img?`<img src="${esc(h.img)}" alt="">`:`<span class="ph">${reel}</span>`;const btn=listed(h)?`<span class="got">Już na liście</span>`:h._adding?`<button type="button" disabled>Dodaję…</button>`:`<button type="button" onclick="addHit(${i})">Dodaj do listy</button>`;const sub=[h.o&&h.o!==h.t?h.o:"",h.y,h.director].filter(Boolean).join(" · ");return `<div class="hit">${thumb}<div class="hitinfo"><b>${esc(h.t)}</b><span>${esc(sub)}</span></div>${btn}</div>`;}).join("");}
async function runSearch(q){const my=++seq;try{const [pl,en]=await Promise.all(["pl","en"].map(lang=>wd({action:"wbsearchentities",search:q,language:lang,type:"item",limit:"20"}).then(d=>d.search||[])));if(my!==seq)return;const hint={};for(const s of pl)hint[s.id]={...(hint[s.id]||{}),pl:s.label};for(const s of en)hint[s.id]={...(hint[s.id]||{}),en:s.label};const ids=[...new Set([...pl,...en].map(s=>s.id))].slice(0,20);if(!ids.length){hits.innerHTML='<p class="note">Brak wyników</p>';lastHits=[];return;}let ents=await getEntities(ids);if(my!==seq)return;const filmIds=[],people=[];for(const id of ids){const e=ents[id];if(!e||e.missing)continue;if(isHuman(e))people.push(id);else if(isFilm(e))filmIds.push(id);}for(const p of people.slice(0,2)){const d=await wd({action:"query",list:"search",srsearch:"haswbstatement:P57="+p,srnamespace:"0",srlimit:"12"});const extra=(d.query.search||[]).map(s=>s.title).filter(t=>/^Q\d+$/.test(t)&&!filmIds.includes(t)).slice(0,12);const more=await getEntities(extra);Object.assign(ents,more);for(const id of extra)if(ents[id]&&(isFilm(ents[id])||isDirectedWork(ents[id])))filmIds.push(id);if(my!==seq)return;}const dirIds=[...new Set(filmIds.flatMap(id=>claimIds(ents[id],"P57")))].slice(0,40);const dirs=await getEntities(dirIds);if(my!==seq)return;const nq=norm(q);lastHits=filmIds.map(id=>toFilm(ents[id],dirs,hint[id])).filter(Boolean).sort((a,b)=>{const sc=h=>norm(h.t)===nq||norm(h.o)===nq?2:norm(h.t).startsWith(nq)||norm(h.o).startsWith(nq)?1:0;return sc(b)-sc(a)||(b.y||"").localeCompare(a.y||"");}).slice(0,8);if(!lastHits.length){hits.innerHTML='<p class="note">Brak wyników</p>';return;}hits.innerHTML='<p class="note">Szukam plakatów…</p>';await Promise.all(lastHits.map(async h=>{if(!h.img)h.img=await findPoster(h);}));if(my!==seq)return;renderHits();}catch(e){if(my!==seq)return;hits.innerHTML='<p class="note">Nie udało się wyszukać. Spróbuj ponownie.</p>';}}
async function addHit(i){const h=lastHits[i];if(!h||h._adding||listed(h)){renderHits();return;}h._adding=true;renderHits();try{if(!h.img)h.img=await findPoster(h)||"";if(!h.yt)h.yt=await findTrailer(h)||"";}catch(e){}if(listed(h)){h._adding=false;renderHits();return;}custom.push(h);saveCustom();catalog();draw();}
function removeCustom(i){const f=films[i];if(!f||!f.custom)return;custom=custom.filter(c=>f.qid?c.qid!==f.qid:c.t!==f.t);saveCustom();if(m[f.t]){delete m[f.t];localStorage.setItem(K,JSON.stringify(m));}catalog();draw();}
q.addEventListener("input",()=>{clearTimeout(timer);const query=q.value.trim();if(query.length<2){seq++;hits.innerHTML="";lastHits=[];return;}hits.innerHTML='<p class="note">Szukam…</p>';timer=setTimeout(()=>runSearch(query),350);});
const onStream=f=>!!(f&&f.custom)||/Netflix|Prime Video|HBO Max|SkyShowtime|Disney\+/.test(f&&f.w||"");
function draw(){const id=secId(),cur=SECS[id],st=cur.st;
const pool=films.filter(onStream);
const cnt=v=>pool.filter(f=>m[f.t]===v).length,home=pool.filter(f=>!(m[f.t]||'')).length;
const on=k=>id===k?'true':'false';
stats.innerHTML=`<button type="button" class="stat sum" aria-pressed="${on('na-liscie')}" onclick="pick('na-liscie')"><b>${home}</b><span>Na liście</span></button><div class="statrow"><button type="button" class="stat w" aria-pressed="${on('do-obejrzenia')}" onclick="pick('do-obejrzenia')"><div class="num">${reel}<b>${cnt("w")}</b></div><span>Do obejrzenia</span></button><button type="button" class="stat r" aria-pressed="${on('do-rozwazenia')}" onclick="pick('do-rozwazenia')"><div class="num">${clap}<b>${cnt("r")}</b></div><span>Do rozważenia</span></button><button type="button" class="stat x" aria-pressed="${on('odrzucone')}" onclick="pick('odrzucone')"><div class="num">${cut}<b>${cnt("x")}</b></div><span>Odrzucone</span></button><button type="button" class="stat d" aria-pressed="${on('obejrzane')}" onclick="pick('obejrzane')"><div class="num">${ticket}<b>${cnt("d")}</b></div><span>Obejrzane</span></button></div>`;
const shown=films.map((f,i)=>({f,i})).filter(x=>onStream(x.f)&&(m[x.f.t]||'')===st);
document.getElementById('sec').innerHTML=`${cur.name} <b>${shown.length}</b>`;
finder.hidden=id!=='na-liscie';
empty.hidden=shown.length>0;
if(lastHits.length)renderHits();
ensureMedia();
list.innerHTML=shown.map(({f,i})=>{const s=m[f.t]||"";const badge=s==="w"?reel+" Obejrzę":s==="r"?clap+" Do rozważenia":s==="d"?ticket+" Obejrzane":s==="x"?cut+" Odrzucone":"";
const rec=id==='na-liscie'&&validRec(f.rec)?`<span class="badge rec">★ Z Twojej rekomendacji</span><p class="why">${esc(f.rec.why)}<span>Na podstawie: ${esc(f.rec.based_on.join(", "))}</span></p>`:"";
const mark=oceny[fid(f)];const asking=ask===i&&id!=='obejrzane';const stars=id==='obejrzane'?`<div class="rate">${Number.isInteger(mark)?`<p class="score">${mark}/10</p>`:""}<div class="stars" role="group" aria-label="Ocena 1 do 10">${starBtns(i,mark,"rate")}</div></div>`:"";const picker=asking?`<div class="askback" onclick="cancelAsk()"></div><div class="ask" role="region" aria-label="Jak oceniasz ten film?" tabindex="-1"><h3>Jak oceniasz ten film?</h3><p class="askt">${esc(f.t)}</p><div class="stars" role="group" aria-label="Ocena 1 do 10">${starBtns(i,mark,"ask")}</div><button type="button" class="askx" onclick="cancelAsk()">Anuluj</button></div>`:"";
const bits=[];if(f.o&&f.o!==f.t)bits.push(f.o);if(f.y)bits.push(f.y);if(f.l)bits.push(f.l);if(f.g)bits.push(f.g);if(f.director)bits.push("reż. "+f.director);
const pills=[f.fw&&`<span class="pill"><i>Filmweb</i> <b>${esc(f.fw)}</b></span>`,f.imdb&&!String(f.imdb).startsWith("http")&&`<span class="pill"><i>IMDb</i> <b>${esc(f.imdb)}</b></span>`,f.rt&&`<span class="pill"><i>RT</i> <b>${esc(f.rt)}</b></span>`].filter(Boolean).join("");
const poster=f.img?`<img src="${esc(f.img)}" alt="Plakat ${esc(f.t)}">`:`<span class="ph big">${reel}<em>Brak plakatu</em></span>`;
const video=f.yt?`<iframe class="video" src="https://www.youtube-nocookie.com/embed/${esc(f.yt)}" title="Zwiastun ${esc(f.t)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`:`<a class="yts" href="https://www.youtube.com/results?search_query=${encodeURIComponent((f.t||"")+" "+(f.o||"")+" trailer")}" target="_blank" rel="noopener">Zwiastun na YouTube ↗</a>`;
const links=f.custom?[f.url&&`<a href="${esc(f.url)}" target="_blank" rel="noopener">Filmweb ↗</a>`,f.imdbUrl&&`<a href="${esc(f.imdbUrl)}" target="_blank" rel="noopener">IMDb ↗</a>`].filter(Boolean).join(" · "):"";
const rm=f.custom?`<button type="button" class="rm" onclick="removeCustom(${i})">Usuń z listy</button>`:"";
return `<div class="card ${s}"><div class="top">${poster}<div class="info">
${rec}${badge?`<span class="badge">${badge}</span>`:""}<h2>${esc(f.t)}</h2>${bits.length?`<div class="meta">${esc(bits.join(" · "))}</div>`:""}
${f.a?`<div class="about">${esc(f.a)}</div>`:""}${pills?`<div class="pills">${pills}</div>`:""}
${f.w?`<div class="meta">📺 ${esc(f.w)}</div>`:""}${links?`<div class="meta">${links}</div>`:""}</div></div>
${stars}
${video}
<div class="btns"><button class="bw ${s==="w"?"on":""}" onclick="set(${i},'w')">${reel} Obejrzę</button><button class="br ${s==="r"?"on":""}" onclick="set(${i},'r')">${clap} Do rozważenia</button><button class="bd ${s==="d"||asking?"on":""}" aria-expanded="${asking?"true":"false"}" onclick="${id==='obejrzane'?`set(${i},'d')`:`askWatch(${i})`}">${ticket} Obejrzane</button><button class="bx ${s==="x"?"on":""}" onclick="set(${i},'x')">${cut} Odrzuć</button>${rm}</div>${picker}</div>`;}).join("");
const box=document.querySelector(".ask");if(box){if(!matchMedia("(max-width:600px)").matches)box.scrollIntoView({block:"nearest"});if(askFocus){box.focus({preventScroll:true});askFocus=false;}}}
fetch('films.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{base=d;return fetch('data/stan.json',{cache:'no-store'}).then(s=>s.ok?s.json():null).catch(()=>null);}).then(stan=>{if(stan)mergeStan(stan);catalog();draw();postSnapshot();}).catch(()=>{catalog();draw();postSnapshot();});
</script></body></html>
