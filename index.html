<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filmy do obejrzenia</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0d0f14;color:#eef0f4}
header{padding:40px 24px 16px;max-width:1200px;margin:auto}h1{margin:0;font-size:36px}header p{color:#9aa3b2;margin:8px 0 0}
.stats{display:flex;flex-direction:column;gap:10px;margin-top:20px}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#171a22;border-radius:14px;padding:14px 12px;min-width:0;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}.stat .num{display:flex;align-items:center;justify-content:center;gap:6px}.stat b{font-size:22px;line-height:1}.stat span{color:#9aa3b2;font-size:13px;line-height:1.25}.stat .ico{width:18px;height:18px}.stat.sum{flex-direction:row;gap:14px;min-height:0;padding:18px 22px}.stat.sum b{font-size:36px}.stat.sum span{font-size:16px;color:#eef0f4}.stat.w{border-top:3px solid #22c55e;color:#22c55e}.stat.r{border-top:3px solid #f59e0b;color:#f59e0b}.stat.x{border-top:3px solid #f87171;color:#f87171}.stat.d{border-top:3px solid #3b82f6;color:#3b82f6}
main{max-width:1200px;margin:auto;padding:16px 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:24px}
.card{background:#171a22;border:2px solid #262b36;border-radius:20px;overflow:hidden;transition:all .3s}
.card.w{border-color:#22c55e;background:linear-gradient(180deg,#123222,#171a22 60%)}.card.r{border-color:#f59e0b;background:linear-gradient(180deg,#3a2a0e,#171a22 60%)}.card.d{border-color:#3b82f6;background:linear-gradient(180deg,#12243f,#171a22 60%)}
.top{display:flex;gap:20px;padding:20px}.top img{width:180px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.6);flex-shrink:0}
.info{display:flex;flex-direction:column;gap:10px}.info h2{margin:0;font-size:26px}.meta{color:#9aa3b2;font-size:14px}.about{line-height:1.5;font-size:15px}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#232835;border-radius:999px;padding:5px 12px;font-size:13px}.pill i{font-style:normal;color:#9aa3b2}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}.w .badge{background:#22c55e;color:#04210f}.r .badge{background:#f59e0b;color:#2b1a00}.d .badge{background:#3b82f6;color:#eff6ff}
.ico{width:16px;height:16px;flex:none;display:block}
.video{aspect-ratio:16/9;width:100%;border:0;display:block}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 20px 20px}.btns button{width:100%;height:100%;min-height:42px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.15;padding:8px 10px}button{border:1px solid #333a48;background:#1f2430;color:#eef0f4;border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer}
button:hover{background:#2a3040}button.on.bw{background:#22c55e;color:#04210f;border-color:#22c55e}button.on.br{background:#f59e0b;color:#2b1a00;border-color:#f59e0b}button.on.bd{background:#3b82f6;color:#eff6ff;border-color:#3b82f6}
#rej{max-width:1200px;margin:auto;padding:0 24px 40px}#rej button{margin:4px}
@media(max-width:600px){main{grid-template-columns:1fr}.top{flex-direction:column}.top img{width:100%}}
@media(max-width:399px){.statrow{grid-template-columns:1fr 1fr}.stat.sum b{font-size:30px}}
</style></head><body>
<header><h1>Filmy do obejrzenia</h1><p>Lista Tomasza. Oznacz film jako do obejrzenia, do rozważenia albo go odrzuć. Wybory zapisują się w tej przeglądarce.</p><div class="stats" id="stats"></div></header>
<main id="list"></main><div id="rej"></div>
<script>
let films=[];const K="koko-filmy";let m=JSON.parse(localStorage.getItem(K)||"{}");
const reel='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.3" fill="currentColor"/><g fill="currentColor"><circle cx="12" cy="6.1" r="1.35"/><circle cx="17.1" cy="9.05" r="1.35"/><circle cx="17.1" cy="14.95" r="1.35"/><circle cx="12" cy="17.9" r="1.35"/><circle cx="6.9" cy="14.95" r="1.35"/><circle cx="6.9" cy="9.05" r="1.35"/></g></svg>';
const clap='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9.2" width="18" height="11" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="currentColor" d="M3.3 9.2 6.7 3.8h2.5L5.6 9.2H3.3zm4.7 0 3.4-5.4h2.5L10.5 9.2H8zm4.7 0 3.4-5.4h2.6L15.2 9.2h-2.5z"/></svg>';
const ticket='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M2.6 7.2h18.8v2.6a2.15 2.15 0 0 0 0 4.2v2.8H2.6v-2.8a2.15 2.15 0 0 0 0-4.2V7.2zm11.3.9h1.5v7.8h-1.5V8.1z"/></svg>';
const cut='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.2" y="2.6" width="11.6" height="18.8" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.7"/><g fill="currentColor"><rect x="8.1" y="4.1" width="1.5" height="1.7" rx=".3"/><rect x="11.25" y="4.1" width="1.5" height="1.7" rx=".3"/><rect x="14.4" y="4.1" width="1.5" height="1.7" rx=".3"/><rect x="8.1" y="18.2" width="1.5" height="1.7" rx=".3"/><rect x="11.25" y="18.2" width="1.5" height="1.7" rx=".3"/><rect x="14.4" y="18.2" width="1.5" height="1.7" rx=".3"/></g><path d="M9 9.6 15 15.6M15 9.6 9 15.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const set=(i,v)=>{const t=films[i].t;m[t]=m[t]===v?"":v;localStorage.setItem(K,JSON.stringify(m));draw()};
function draw(){const ord=v=>v==="w"?0:v==="r"?1:v==="d"?3:2;
const vis=films.map((f,i)=>({f,i})).filter(x=>m[x.f.t]!=="x").sort((a,b)=>ord(m[a.f.t])-ord(m[b.f.t])||a.i-b.i);
const cnt=v=>films.filter(f=>m[f.t]===v).length;
stats.innerHTML=`<div class="stat sum"><b>${vis.length}</b><span>Na liście</span></div><div class="statrow"><div class="stat w"><div class="num">${reel}<b>${cnt("w")}</b></div><span>Do obejrzenia</span></div><div class="stat r"><div class="num">${clap}<b>${cnt("r")}</b></div><span>Do rozważenia</span></div><div class="stat x"><div class="num">${cut}<b>${cnt("x")}</b></div><span>Odrzucone</span></div><div class="stat d"><div class="num">${ticket}<b>${cnt("d")}</b></div><span>Obejrzane</span></div></div>`;
list.innerHTML=vis.map(({f,i})=>{const s=m[f.t]||"";return `<div class="card ${s}"><div class="top"><img src="${f.img}" alt="Plakat ${f.t}"><div class="info">
${s?`<span class="badge">${s==="w"?reel+" Obejrzę":s==="r"?clap+" Do rozważenia":ticket+" Obejrzane"}</span>`:""}<h2>${f.t}</h2><div class="meta">${f.o!==f.t?f.o+" · ":""}${f.y}${f.l?" · "+f.l:""} · ${f.g}</div>
<div class="about">${f.a}</div><div class="pills"><span class="pill"><i>Filmweb</i> <b>${f.fw}</b></span><span class="pill"><i>IMDb</i> <b>${f.imdb}</b></span><span class="pill"><i>RT</i> <b>${f.rt}</b></span></div>
<div class="meta">📺 ${f.w}</div></div></div>
<iframe class="video" src="https://www.youtube-nocookie.com/embed/${f.yt}" title="Zwiastun ${f.t}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<div class="btns"><button class="bw ${s==="w"?"on":""}" onclick="set(${i},'w')">${reel} Obejrzę</button><button class="br ${s==="r"?"on":""}" onclick="set(${i},'r')">${clap} Do rozważenia</button><button class="bd ${s==="d"?"on":""}" onclick="set(${i},'d')">${ticket} Obejrzane</button><button onclick="set(${i},'x')">${cut} Odrzuć</button></div></div>`}).join("");
const rj=films.map((f,i)=>({f,i})).filter(x=>m[x.f.t]==="x");rej.innerHTML=rj.length?`<h3>Odrzucone</h3>`+rj.map(({f,i})=>`<button onclick="set(${i},'x')">↩ Przywróć: ${f.t}</button>`).join(""):"";}
fetch('films.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{films=d;draw()});
</script></body></html>
